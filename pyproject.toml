[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-csv-loader"
version="0.1.0"
description="Generate Oracle starter DDL and SQL*Loader control files from CSV."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-csv-loader="ora_csv_loader.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
